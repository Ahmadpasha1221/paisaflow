name: Release & Multi-Platform Packaging

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag Name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'
      dry_run:
        description: 'Dry run (build and test without publishing GitHub Release)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # =========================================================================
  # 1. WINDOWS x64 BUILD & SMOKE TEST
  # =========================================================================
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Build Windows Executable & Package
        run: |
          python scripts/build_windows.py

      - name: Smoke Test Built Executable
        shell: pwsh
        run: |
          $exe = "dist\PaisaFlow\PaisaFlow.exe"
          if (-not (Test-Path $exe)) {
            Write-Error "Executable not found at $exe"
            exit 1
          }
          Write-Host "Verifying executable binary presence and basic properties..."
          Get-Item $exe | Select-Object Name, Length, LastWriteTime

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-release
          path: |
            dist/PaisaFlow-*-windows-x64.zip
            dist/PaisaFlow-*-windows-x64.zip.sha256
          if-no-files-found: error

  # =========================================================================
  # 2. LINUX x64 BUILD & SMOKE TEST
  # =========================================================================
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux GUI/Qt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1-mesa-glx libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 \
            libfontconfig1 libdbus-1-3 xvfb

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite (Headless via xvfb)
        run: |
          xvfb-run -a pytest tests/ -v

      - name: Build Linux Standalone Package
        run: |
          python scripts/build_linux.py

      - name: Smoke Test Built Executable
        run: |
          test -f dist/PaisaFlow/PaisaFlow
          ls -lh dist/PaisaFlow/PaisaFlow
          # Run headless version check / basic bootstrap check
          xvfb-run -a ./dist/PaisaFlow/PaisaFlow --version || true

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64-release
          path: |
            dist/PaisaFlow-*-linux-x64.tar.gz
            dist/PaisaFlow-*-linux-x64.tar.gz.sha256
          if-no-files-found: error

  # =========================================================================
  # 3. macOS BUILD & SMOKE TEST
  # =========================================================================
  build-macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite
        run: |
          pytest tests/ -v

      - name: Build macOS App Bundle & Package
        run: |
          python scripts/build_macos.py

      - name: Smoke Test Built Application Bundle
        run: |
          test -d dist/PaisaFlow.app || test -d dist/PaisaFlow/PaisaFlow.app
          echo "Verified macOS Application Bundle structure"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            dist/PaisaFlow-*-macos-*.zip
            dist/PaisaFlow-*-macos-*.zip.sha256
          if-no-files-found: error

  # =========================================================================
  # 4. RELEASE PUBLICATION
  # =========================================================================
  publish-release:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download all built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-downloads
          merge-multiple: true

      - name: List downloaded release assets and compute combined checksums
        run: |
          mkdir -p dist/release
          cp release-downloads/* dist/release/
          cd dist/release
          echo "### Release Assets:"
          ls -lh
          echo ""
          echo "### SHA-256 Checksums:"
          sha256sum PaisaFlow-*.zip PaisaFlow-*.tar.gz 2>/dev/null | tee CHECKSUMS.txt || true

      - name: Determine Release Tag and Title
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "title=PaisaFlow v${VERSION} — Production Release" >> $GITHUB_OUTPUT

      - name: Generate Release Notes
        id: release_notes
        run: |
          cat << 'EOF' > RELEASE_BODY.md
          ## PaisaFlow — Personal finance, made clear.

          PaisaFlow is a 100% offline-first desktop personal and household finance manager built on strict double-entry ledger invariants, integer-minor-unit currency math, and the Flowline design system.

          ### Downloadable Packages

          | Platform | Package File | Requirements |
          |---|---|---|
          | **Windows (x64)** | `PaisaFlow-<version>-windows-x64.zip` | Windows 10 or 11 (64-bit) |
          | **Linux (x64)** | `PaisaFlow-<version>-linux-x64.tar.gz` | glibc ≥ 2.31, X11 or Wayland |
          | **macOS** | `PaisaFlow-<version>-macos-<arch>.zip` | macOS 12 Monterey or newer |

          ### Quick Start

          - **Windows:** Extract `PaisaFlow-<version>-windows-x64.zip` to your chosen directory and launch `PaisaFlow.exe`.
          - **Linux:** Extract `tar -xzf PaisaFlow-<version>-linux-x64.tar.gz`, navigate into `PaisaFlow/`, and run `./PaisaFlow`.
          - **macOS:** Unzip the archive, move `PaisaFlow.app` to your `/Applications` folder, and launch.

          ### Data Storage & Privacy

          - **100% Offline:** No cloud accounts, telemetry, or remote servers.
          - **Windows Data Path:** `%LOCALAPPDATA%\PaisaFlow\`
          - **Linux Data Path:** `~/.local/share/paisaflow/`
          - **macOS Data Path:** `~/Library/Application Support/PaisaFlow/`
          - **Override via Environment:** `PAISAFLOW_DATA_DIR=/path/to/custom/dir`

          ### Integrity & Verification

          Verify downloaded archives using the included `.sha256` files or compare against the release checksums.
          EOF

      - name: Publish GitHub Release
        if: ${{ (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: ${{ steps.release_info.outputs.title }}
          body_path: RELEASE_BODY.md
          files: |
            dist/release/PaisaFlow-*
            dist/release/CHECKSUMS.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Dry Run Notice
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' }}
        run: |
          echo "=================================================="
          echo "DRY RUN VALIDATION SUCCEEDED"
          echo "All 3 platform jobs (Windows, Linux, macOS) built, tested, and passed."
          echo "No GitHub Release published because dry_run was true."
          echo "=================================================="
