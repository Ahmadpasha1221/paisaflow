[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "paisaflow"
version = "0.1.0"
description = "Personal finance, made clear. Offline-first desktop money manager."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PaisaFlow Team" }
]
dependencies = [
    "PySide6>=6.6.0",
    "SQLAlchemy>=2.0.0",
    "alembic>=1.13.0",
    "pydantic>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.3.0",
    "ruff>=0.3.0",
    "pillow>=10.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
paisaflow = "paisaflow.main:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
